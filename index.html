<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fouizya's Birthday Countdown ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1> Countdown For Fouizya's Birthday ❤️</h1>
        <p class="subtitle">Keep Smiling My Princess ✨</p>

        <div class="countdown">
            <div class="box">
                <span id="days">00</span>
                <small>Days</small>
            </div>

            <div class="box">
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div class="box">
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div class="box">
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>
        </div>

        <h2 id="message"></h2>
    </div>

    <script src="script.js"></script>

</body>
</html>
